name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Typecheck, Build & Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: geo_user
          POSTGRES_PASSWORD: geo_test_password
          POSTGRES_DB: geo_recogida_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U geo_user -d geo_recogida_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      PORT: 4000
      CORS_ORIGIN: http://localhost:5173
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: geo_recogida_test
      DB_USER: geo_user
      DB_PASSWORD: geo_test_password
      JWT_ACCESS_SECRET: ci_test_access_secret_key_with_at_least_32_chars_1234
      JWT_REFRESH_SECRET: ci_test_refresh_secret_key_with_at_least_32_chars_5678

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Initialize PostGIS database schema
        run: PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -p $DB_PORT -U $DB_USER -d $DB_NAME -f database/init.sql

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Build TypeScript
        run: npm run build

      - name: Run integration tests
        run: npm test

  frontend:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build